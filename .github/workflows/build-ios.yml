name: Build iOS IPA

on:
  push:
    branches: [main, feature/xbox-console-dashboard]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Native iOS build and unsigned IPA
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Display toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build iPhone app without code signing
        run: |
          set -o pipefail
          xcodebuild \
            -project RayxCloud.xcodeproj \
            -scheme RayxCloud \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/RayxCloudDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA for personal signing
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/RayxCloudDerivedData/Build/Products/Release-iphoneos/RayxCloud.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/RayxCloud-unsigned.ipa" Payload)
          test -s dist/RayxCloud-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RayxCloud-unsigned-ipa
          path: dist/RayxCloud-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
